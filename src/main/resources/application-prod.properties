# Perfil de producción - configuración segura
# Se activa con: spring.profiles.active=prod

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate

# Logging más restrictivo en producción
logging.level.root=WARN
logging.level.com.lastulas.ica=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# Desactivar consola H2 si está presente
spring.h2.console.enabled=false

# Configuración de conexión más robusta
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Seguridad adicional
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
app.jwt.require-configured-secret=true