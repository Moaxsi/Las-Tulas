spring.application.name=las-tulas-backend
server.port=8080

# Soporte para túneles y proxies inversos (Pinggy, Ngrok, Cloudflare)
# Permite que Spring Boot reconozca HTTPS y las IPs reales de dispositivos móviles
server.forward-headers-strategy=framework

# Configuración privada opcional para desarrollo local desde el IDE.
# El archivo .env está ignorado por Git. Render también permite montarlo como Secret File.
spring.config.import=optional:file:.env[.properties],optional:file:/etc/secrets/.env[.properties]

# Supabase Session Pooler. Suministra la contraseña mediante SPRING_DATASOURCE_PASSWORD.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-0-us-east-1.pooler.supabase.com:5432/postgres?sslmode=verify-full&sslfactory=org.postgresql.ssl.SingleCertValidatingFactory&sslfactoryarg=classpath:supabase-ca.crt}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres.sqmehcrdudnscjehjhtf}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Mantener la estructura creada en el schema SQL
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Token de Decolecta (RENIEC/SUNAT). Nunca pongas aquí la API key ni una URL.
# Define DECOLECTA_TOKEN en el entorno que inicia el backend.
decolecta.token=${DECOLECTA_TOKEN:}

# =====================================================
# PUNTO 9 - Firma de los tokens JWT
# =====================================================
# En desarrollo, si APP_JWT_SECRET no está definida, el backend genera una
# clave aleatoria en memoria; los tokens se invalidan en el siguiente reinicio.
# El perfil prod exige una clave persistente configurada en el entorno:
#
#   PowerShell:  $env:APP_JWT_SECRET = [Convert]::ToBase64String((1..48 | ForEach-Object { Get-Random -Maximum 256 }))
#                (tiene que dar 32 caracteres o más)
#
# El login dura 12 horas, lo que cubre un turno de caja completo.
app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.require-configured-secret=false
app.jwt.issuer=las-tulas
app.jwt.expiracion-horas=12

# =====================================================
# PUNTO 12 - Tasa de IGV
# =====================================================
# El valor por defecto vive en la tabla "parametros" (clave IGV_TASA), NO acá.
# Se cambia con un UPDATE y el backend lo toma en la siguiente venta:
#   UPDATE parametros SET valor = '0.18' WHERE clave = 'IGV_TASA';
# El precio de carta ya incluye IGV, por eso el total no cambia: el backend
# solo desarma el total en subtotal + igv para el comprobante.
igv.tasa-por-defecto=0.18
